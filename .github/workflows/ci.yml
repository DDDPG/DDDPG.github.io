name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter

      - name: Check internal links & anchors (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress '_site/**/*.html'
          fail: true

      - name: Check external links (non-blocking)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,201,202,204,301,302,403,429 '_site/**/*.html'
          fail: false
