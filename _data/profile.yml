bio_short: >-
  I am Kangdi Wang, an independent Audio AI researcher and builder — now interning
  with the Qwen Omni team. Before research I spent three years as a mix engineer on
  stems, live streams, and REAPER-based tooling; that production side still sits next
  to the ML work. I look at neural audio representations, generative music, multimodal
  audio, and audio agents — mostly from a signal-processing and mixing background.

cv_summary: >-
  Audio AI researcher and engineer working at the intersection of neural audio
  representation, generative music, and professional music production. Core
  contributor and second author of Qwen-Music, an industrial-scale music generation
  system, with hands-on experience in audio quality optimization, music mixing/editing,
  evaluation, data pipelines, and music agents. First author of εar-VAE
  (INTERSPEECH 2026) and of εar-VAE2 for high-fidelity stereo music reconstruction
  with frequency-aware complex-spectral modeling. In parallel, 3+ years of stem/live
  mixing experience, professional mixing training at Modern Sky, and practical
  DAW/audio tooling. Interested in generative audio, audio representation, DSP,
  music understanding, and agentic audio systems.

about_short: >-
  I am Kangdi Wang, an independent Audio AI researcher and builder — currently interning
  with the Qwen Omni foundation team on music generation, agentic post-training, and
  audio-quality data curation (annotation standards and pipeline filtering). My work
  focuses on neural audio representations, generative music modeling, and high-fidelity sound
  synthesis. I design audio architectures that bridge mathematical optimization with human
  auditory perception — spanning perceptually grounded neural autoencoders (εar-VAE, ear-VAE2),
  semantic music tokenization (Duo-Tok), industrial music foundation models (Qwen-Music),
  and multimodal video dubbing (CineDub). A three-year stem-mixing and live-production
  background (Modern Sky training, campus and label sessions) grounds this research in
  real-world audio craft. Through Epsilon Acoustic Revolution Lab (εar-LAB), I develop
  open-source neural audio models and research tools for the audio AI community.

philosophy: >-
  Standard waveform and spectral objectives often penalize imperceptible phase shifts while
  overlooking structural psychoacoustic phenomena. My research explores perceptually grounded
  representations and frequency-domain inductive biases — integrating psychoacoustic weighting,
  complex-spectral phase modeling, and source-aware tokenization into generative audio
  architectures — to build systems that reconstruct and synthesize sound with true
  perceptual fidelity.

