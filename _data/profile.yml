bio_short: 'I build audio models and tools with a focus on perceptual quality: how music preserves detail,
  phase, and stereo space. My work spans first-author research on εar-VAE and ear-VAE2, music generation
  at Qwen Omni, and REAPER-based audio engineering. Three years of mixing and live production inform both
  the problems I study and the way I evaluate results.'
about_short: I work across perceptual audio representation, music generation, and audio software. I am
  first author of εar-VAE and ear-VAE2, a co-first author of CineDub, and a contributor to Qwen-Music
  and DuoTok. At Qwen Omni, my work includes music decoder development, listening evaluation, and audio-quality
  data curation. Alongside research, I build tools for inspecting audio and working with REAPER projects.
  My background in mixing, live production, and robotics connects model design with practical audio workflows.
philosophy: I study how training objectives and model architecture affect audible detail, phase coherence,
  and stereo imaging. My work uses perceptual weighting, complex-spectral representations, and listening
  evaluation to connect improvements in model behavior with the sound people hear.
