# Competence matrix — grouped by function, not a flat tool list.

- group: Audio AI Modeling
  items:
  - Perceptual audio autoencoders — εar-VAE / ear-VAE2
  - Music tokenization — DuoTok
  - Music generation and audio rendering — Qwen-Music
  - Multimodal speech and sound generation — CineDub
- group: Signal Processing & Perception
  items:
  - Complex STFT, magnitude & phase modeling
  - Perceptual weighting & stereo reconstruction
  - Listening evaluation & audio-quality annotation
  - Speech synthesis & generative vocoders
- group: Audio Production & DAW
  items:
  - Python / Lua — REAPER workflow tooling
  - TypeScript / React — audio interfaces
  - Stem mixing & live-stream audio chains
  - REAPER · Pro Tools · Studio One
