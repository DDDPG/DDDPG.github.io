- id: ear-vae2
  order: 5
  title: "Fourier is Frontier: Frequency-Aware Autoencoding for High-Fidelity Music Reconstruction"
  alias: "ear-VAE2"
  year: 2026
  date: "2026.08"
  venue: "arXiv:2608.19843"
  venue_short: "arXiv"
  area: "Frequency-Aware Representation"
  arxiv: "2608.19843"
  cover: /assets/img/papers/ear-vae2.png
  role: "First Author"
  lead: true
  topics: [repr]
  index_label: "Work 05 · Frequency-Aware Representation · 2026"
  cover_mast: "arXiv:2608.19843 — cs.SD"
  cover_seed: 67
  caption: >-
    A frequency-aware complex-spectral autoencoder that models magnitude, phase, and
    stereo structure explicitly — giving high-fidelity music representation a frequency
    axis to reason about.
  concepts: ["Complex STFT", "Spec-SnakeBeta", "Duplex-Aware Refiner"]
  problem: >-
    1D temporal convolutions struggle to capture explicit harmonic relationships,
    frequency-dependent phase structures, and cross-channel stereo correlation.
  approach: >-
    Formulated autoencoding directly in the 2D complex STFT domain, introducing
    Spec-SnakeBeta frequency modeling and a Duplex-Aware Refiner for joint magnitude,
    phase, and stereo modeling.
  impact: >-
    Demonstrates that explicit frequency-axis modeling in the complex spectral domain
    significantly outperforms purely temporal backbones in high-fidelity music
    representation.
