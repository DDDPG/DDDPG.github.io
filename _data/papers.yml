  alias: "DUO-TOK"
  year: 2025
  date: "2025.11"
  venue: "arXiv:2511.20224"
  venue_short: "ACM MM 2026"
  conference: "ACM Multimedia 2026"
  area: "Music Tokenization"
  arxiv: "2511.20224"
  cover: /assets/img/papers/duo-tok.png
  role: "Co-author · Core Idea"
  lead: false
  topics: [gen]
  index_label: "Work 02 · Music Tokenization · 2025"
  cover_mast: "arXiv:2511.20224 — cs.SD"
  cover_seed: 23
  caption: >-
    A source-aware dual-track semantic tokenizer that splits music into vocal and
    accompaniment token streams — a cleaner representation for controllable song generation.
  concepts: ["Semantic tokens", "Vocal–accompaniment", "Source-aware"]
  problem: >-
    Monolithic music tokenizers entangle vocal melodies and instrumental accompaniment,
    limiting controllability in downstream generative models.
  approach: >-
    Proposed a source-aware dual-codebook architecture that factorizes musical audio into
    independent vocal and accompaniment semantic token streams with latent diffusion decoding.
  impact: >-
    Enables fine-grained structural control and source-separated generation in large-scale
    autoregressive music systems.

