  title: 'Back to Ear: Perceptually Driven High Fidelity Music Reconstruction'
  alias: εar-VAE
  year: 2025
  date: '2025.09'
  venue: INTERSPEECH 2026
  venue_short: INTERSPEECH 2026
  area: Perceptual Audio Representation
  arxiv: '2509.14912'
  cover: /assets/img/papers/ear-vae.png
  code: https://github.com/Eps-Acoustic-Revolution-Lab/EAR_VAE
  role: First Author
  lead: true
  topics:
  - repr
  index_label: Work 01 · Perceptual Audio · 2025
  cover_mast: arXiv:2509.14912 — cs.SD
  cover_seed: 11
  caption: Reconstructing music with perceptual weighting, phase supervision, and stereo-aware losses
    to preserve high-frequency detail and spatial cues.
  concepts:
  - K-weighting
  - Phase-aware loss
  - Stereo supervision
  problem: Existing neural audio autoencoders optimize mathematical loss surfaces that do not align with
    human auditory perception and stereo spatial perception.
  approach: Introduced psychoacoustically informed K-weighting loss functions, phase-aware spectral supervision,
    and stereo-consistent reconstruction objectives into a continuous latent autoencoder.
  impact: Evaluated at 44.1 kHz against open-source audio autoencoders, with improvements in spectral
    reconstruction and stereo characteristics.
  project: https://eps-acoustic-revolution-lab.github.io/EAR_VAE/
  contribution: First-author work on perceptually grounded objectives for music reconstruction.
  conference: INTERSPEECH 2026
- id: duo-tok
  order: 5
  title: 'DuoTok: Source-Aware Dual-Track Music Tokenization for Vocal-Accompaniment Generation'
  alias: DuoTok
  year: 2025
  date: '2025.11'
  venue: ACM Multimedia 2026
  venue_short: ACM MM 2026
  area: Music Tokenization
  arxiv: '2511.20224'
  cover: /assets/img/papers/duo-tok.png
  role: Co-author
  lead: false
  topics:
  - gen
  index_label: Work 02 · Music Tokenization · 2025
  cover_mast: arXiv:2511.20224 — cs.SD
  cover_seed: 23
  caption: Separate vocal and accompaniment token streams preserve source structure for controllable music
    generation.
  concepts:
  - Semantic tokens
  - Vocal–accompaniment
  - Source-aware
  problem: Monolithic music tokenizers entangle vocal melodies and instrumental accompaniment, limiting
    controllability in downstream generative models.
  approach: Proposed a source-aware dual-codebook architecture that factorizes musical audio into independent
    vocal and accompaniment semantic token streams with latent diffusion decoding.
  impact: Enables fine-grained structural control and source-separated generation in large-scale autoregressive
    music systems.
  contribution: Co-author; contributed the core research idea for source-aware music tokenization.
  conference: ACM Multimedia 2026
