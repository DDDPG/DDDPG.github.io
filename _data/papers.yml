  cover: /assets/img/papers/ear-vae.png
  code: "https://github.com/DDDPG/EAR_VAE"
  role: "First Author"
  lead: true
  topics: [repr]
  index_label: "Work 01 · Perceptual Audio · 2025"
  cover_mast: "arXiv:2509.14912 — cs.SD"
  cover_seed: 11
  caption: >-
    A perceptually driven neural audio autoencoder for high-fidelity 44.1kHz stereo
    music reconstruction — optimizing for what humans actually hear through K-weighting,
    phase-aware, and stereo-aware spectral supervision.
  concepts: ["K-weighting", "Phase-aware loss", "Stereo supervision"]
  problem: >-
    Existing neural audio autoencoders optimize mathematical loss surfaces that do not
    align with human auditory perception and stereo spatial perception.
  approach: >-
    Introduced psychoacoustically informed K-weighting loss functions, phase-aware
    spectral supervision, and stereo-consistent reconstruction objectives into a
    continuous latent autoencoder.
  impact: >-
    Achieves state-of-the-art 44.1kHz stereo music reconstruction with a compact
    continuous latent space, providing a strong perceptual foundation for downstream
    generative models.

- id: duo-tok
  order: 2
