- id: ear-vae2
  order: 1
  title: 'Fourier is Frontier: Frequency-Aware Autoencoding for High-Fidelity Music Reconstruction'
  alias: ear-VAE2
  year: 2026
  date: '2026.08'
  venue: arXiv:2608.19843
  venue_short: arXiv
  area: Frequency-Aware Representation
  arxiv: '2608.19843'
  cover: /assets/img/papers/ear-vae2.png
  role: First Author
  lead: true
  topics:
  - repr
  index_label: Work 05 · Frequency-Aware Representation · 2026
  cover_mast: arXiv:2608.19843 — cs.SD
  cover_seed: 67
  caption: A complex-spectral autoencoder that directly models frequency, phase, and stereo structure
    to address lost high frequencies and collapsed stereo images.
  concepts:
  - Complex STFT
  - Spec-SnakeBeta
  - Duplex-Aware Refiner
  problem: 1D temporal convolutions struggle to capture explicit harmonic relationships, frequency-dependent
    phase structures, and cross-channel stereo correlation.
  approach: Formulated autoencoding directly in the 2D complex STFT domain, introducing Spec-SnakeBeta
    frequency modeling and a Duplex-Aware Refiner for joint magnitude, phase, and stereo modeling.
  impact: On the 546-track Song Describer Dataset, the model reports the best point estimates on five
    of seven reconstruction metrics in the paper’s comparison.
  code: https://github.com/Eps-Acoustic-Revolution-Lab/EAR_VAE2
  project: https://eps-acoustic-revolution-lab.github.io/EAR_VAE2/
  contribution: First-author work on frequency-aware autoencoding and perceptually guided stereo refinement.
