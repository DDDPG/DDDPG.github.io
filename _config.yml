      path: ""
    values:
      image: /assets/img/og-image.png

# Keep working documents, tooling and the design-system preview out of the built site
exclude:
  - docs/
  - .cursor/
  - .tasks/
  - design_system_preview.html
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - node_modules/
