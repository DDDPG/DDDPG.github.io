<section class="page-head">
  <div class="wrap">
    <span class="rail-index" data-reveal style="--d:.05s">{{ include.kicker }}</span>
    <h1 class="page-title" data-reveal style="--d:.15s">{{ include.title }}</h1>
    {% if include.lede %}<p class="page-lede" data-reveal style="--d:.25s">{{ include.lede }}</p>{% endif %}
    {% if include.pdf %}<a class="cv-download" href="{{ include.pdf | relative_url }}" download>Download PDF</a>{% endif %}
  </div>
</section>
