---
layout: default
---

<article class="post">
  <div class="wrap">
    <header class="post-head">
      <span class="log-date">{{ page.date | date: "%Y.%m.%d" }}</span>
      <h1 class="post-title">{{ page.title }}</h1>
    </header>
    <div class="post-body prose">
      {{ content }}
    </div>
  </div>
</article>

<p class="section-outlet wrap"><a class="u-link" href="{{ '/blog/' | relative_url }}">← All posts</a></p>
