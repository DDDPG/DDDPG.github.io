<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}" data-theme="paper">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
/* Apply persisted/system theme before first paint to avoid flashing. */
(function () {
  var t = null;
  try { t = localStorage.getItem('kw-theme'); } catch (e) {}
  if (!t) { t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'studio' : 'paper'; }
  document.documentElement.dataset.theme = t;
})();
</script>
